<section class="page-section narrow">
  <div class="section-header">
    <div>
      <h2>Edit Password</h2>
      <p>Update this saved password record.</p>
    </div>
  </div>

  <p class="muted-state" *ngIf="isLoading">Loading record...</p>

  <form *ngIf="!isLoading" [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="form form-panel">
    <label>
      <span>Name</span>
      <input type="text" formControlName="name">
    </label>
    <p class="field-error" *ngIf="passwordForm.get('name')?.touched && passwordForm.get('name')?.invalid">
      Name is required.
    </p>

    <label>
      <span>Username</span>
      <input type="text" formControlName="username" autocomplete="username">
    </label>
    <p class="field-error" *ngIf="passwordForm.get('username')?.touched && passwordForm.get('username')?.invalid">
      Username is required.
    </p>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password">
    </label>
    <p class="field-error" *ngIf="passwordForm.get('password')?.touched && passwordForm.get('password')?.invalid">
      Password is required.
    </p>

    <p class="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="form-actions">
      <button type="submit" class="primary-button" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Updating...' : 'Update Password' }}
      </button>
      <a class="secondary-link" routerLink="/dashboard/passwords">Cancel</a>
    </div>
  </form>
</section>
