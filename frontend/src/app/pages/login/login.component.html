<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-header">
      <p class="eyebrow">Secure Password Vault</p>
      <h1>Welcome Back</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email">
      </label>
      <p class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        Enter a valid email.
      </p>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password">
      </label>
      <p class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Password is required.
      </p>

      <p class="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="primary-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <p class="auth-link">Need an account? <a routerLink="/register">Register</a></p>
  </section>
</main>
