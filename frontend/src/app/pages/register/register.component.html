<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-header">
      <p class="eyebrow">Secure Password Vault</p>
      <h1>Create Account</h1>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form">
      <label>
        <span>Name</span>
        <input type="text" formControlName="name" autocomplete="name">
      </label>
      <p class="field-error" *ngIf="name?.touched && name?.invalid">Enter your name.</p>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email">
      </label>
      <p class="field-error" *ngIf="email?.touched && email?.invalid">Enter a valid email.</p>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="new-password">
      </label>
      <p class="field-error" *ngIf="password?.touched && password?.errors?.['passwordPolicy']">
        Password needs 8 characters, uppercase, lowercase, number, and special character.
      </p>

      <label>
        <span>Confirm Password</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password">
      </label>
      <p class="field-error" *ngIf="confirmPassword?.touched && registerForm.errors?.['passwordMismatch']">
        Passwords must match.
      </p>

      <p class="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="primary-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating...' : 'Register' }}
      </button>
    </form>

    <p class="auth-link">Already have an account? <a routerLink="/login">Login</a></p>
  </section>
</main>
