spring.application.name=secure-password-vault
server.port=8080

spring.datasource.url=jdbc:h2:mem:password_vault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=ChangeThisJwtSecretKeyToAtLeast32CharactersLong
app.jwt.expiration-ms=86400000
app.aes.secret=ChangeThisAesSecretKeyToAtLeast32CharactersLong
